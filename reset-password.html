<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FidanZone - Şifre Sıfırla</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f9f7f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .kart { background: white; border-radius: 12px; padding: 32px; max-width: 400px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { color: #2D5016; font-size: 24px; }
    input { width: 100%; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #2D5016; }
    button { width: 100%; padding: 14px; background: #2D5016; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1a3009; }
    .mesaj { text-align: center; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
    .basari { background: #dcfce7; color: #16a34a; }
    .hata { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>
  <div class="kart">
    <div class="logo">
      <h1>🌳 FidanZone</h1>
      <p style="color:#6b7280; font-size:13px; margin-top:4px;">Yeni şifrenizi belirleyin</p>
    </div>
    <input type="password" id="sifre" placeholder="Yeni şifre (min. 6 karakter)" />
    <input type="password" id="sifreTekrar" placeholder="Şifre tekrar" />
    <button onclick="sifreDegistir()">🔑 Şifremi Güncelle</button>
    <div id="mesaj"></div>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://wezxsuqaewmrkgveqdpm.supabase.co',
      'sb_publishable_kNnQLZRqqv9pXBZKz7l0Gg_xQwhIcoH'
    );

    // URL'den token al
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        console.log('Şifre sıfırlama modu aktif');
      }
    });

    async function sifreDegistir() {
      const sifre = document.getElementById('sifre').value;
      const sifreTekrar = document.getElementById('sifreTekrar').value;
      const mesajDiv = document.getElementById('mesaj');

      if (sifre.length < 6) {
        mesajDiv.className = 'mesaj hata';
        mesajDiv.textContent = 'Şifre en az 6 karakter olmalı!';
        return;
      }
      if (sifre !== sifreTekrar) {
        mesajDiv.className = 'mesaj hata';
        mesajDiv.textContent = 'Şifreler eşleşmiyor!';
        return;
      }

      const { error } = await sb.auth.updateUser({ password: sifre });
      if (error) {
        mesajDiv.className = 'mesaj hata';
        mesajDiv.textContent = 'Hata: ' + error.message;
      } else {
        mesajDiv.className = 'mesaj basari';
        mesajDiv.textContent = '✅ Şifreniz güncellendi! Uygulamaya dönüp giriş yapabilirsiniz.';
      }
    }
  </script>
</body>
</html>
